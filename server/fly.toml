app = "fatloss-analyzer"
primary_region = "fra"

[build]

[env]
  FIREBASE_PROJECT_ID = "fat-loss-6516d"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm so AI meal scans never hit a cold-start (the proxy was giving up
  # ~8s while waking the stopped machine, freezing the app's "+"). Small always-on cost (~$/month).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
